    resource_type: azure.keyvault.vault
    resource_name: kv-assay-insecure
    provider: azure
    note: "enablePurgeProtection false"
  - rule_id: ASSAY-AZ-DSK-001
    resource_type: azure.compute.disk
    resource_name: disk-assay-insecure
    provider: azure
    note: "no encryption block and no encryption settings"
