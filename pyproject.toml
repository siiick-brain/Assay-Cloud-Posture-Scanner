[project]
name = "assay-cspm"
version = "0.1.0"
description = "Cloud security posture scanner for AWS and Azure with rule scoring, evidence reports and control mapping"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "siiick-brain" }]
dependencies = [
    "boto3>=1.35",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "cryptography>=43",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19", "azure-mgmt-storage>=21", "azure-mgmt-network>=27", "azure-mgmt-keyvault>=10", "azure-mgmt-compute>=33"]

[project.scripts]
cspm = "cspm.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "moto[server]>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "boto3-stubs[s3,ec2,iam,kms,rds,cloudtrail,secretsmanager,acm,sts]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cspm", "rules"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["cspm", "rules"]

[[tool.mypy.overrides]]
module = ["moto.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "emulator: needs the Moto server on localhost:5000",
    "docker: needs a running Docker daemon",
]

[tool.coverage.run]
source = ["cspm", "rules"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
