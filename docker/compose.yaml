# Local services for development and tests. Nothing here talks to a real cloud.
# Start Moto: docker compose -f docker/compose.yaml up -d moto (MOTO_HOST_PORT moves the host port)
# Run OpenSCAP: scripts/openscap/run.sh (builds the two images below itself)
name: assay-cspm

services:
  moto:
    # motoserver/moto 5.2.6, pinned by manifest digest to match CI.
    image: motoserver/moto@sha256:344e076f31ad1f5ff1ec4492f741e7d42911d1c7a1ef9b1590f56c340b968513
    ports:
      # Bound to loopback so the emulator is not reachable from the LAN.
      - "127.0.0.1:${MOTO_HOST_PORT:-5000}:5000"
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 5s
      timeout: 3s
      retries: 20

  openscap:
    build: ./openscap
    image: assay-openscap:local
    profiles: [openscap]

  oscap-target:
    build: ./target
    image: assay-oscap-target:local
    profiles: [openscap]
