# Rules informed by this framework. One-line rationales are our own words, not standard text.
framework: nist-800-53
name: NIST SP 800-53 Rev. 5
family: nist
note: Curated subset of controls relevant to cloud configuration. Counts with NIST CSF 2.0 as one framework.
mappings:
  ASSAY-S3-001:
  - control: AC-3
    rationale: Anonymous reads bypass the access decisions this control expects every request to pass.
  - control: AC-22
    rationale: Data anyone can fetch is public content, which should only happen by a deliberate decision.
  ASSAY-S3-002:
  - control: AC-3
