  ASSAY-S3-003:
  - control: SC-28
    rationale: Stored data lacks the at-rest protection this control asks for.
  - control: SC-28(1)
    rationale: The specific gap is missing encryption of stored data.
  ASSAY-S3-004:
  - control: CP-9
    rationale: Without older versions there is no copy to restore from.
  ASSAY-S3-005:
  - control: AU-2
    rationale: The events needed for investigation are not being logged.
  - control: AU-12
    rationale: Audit records are not generated for this activity.
